# Server configuration
server.port=8080

# Application name
spring.application.name=vishwakarma-contractor-backend

# -------------------------------------------------------------
# Live Supabase PostgreSQL Database Connection (Verified IPv4 Connection Pooler for Render)
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.jvnkvrecneirfcjhthgz}
spring.datasource.password=${DB_PASSWORD:Kuldeep@902285}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly declare dialect so Hibernate never requires remote metadata probing
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Resilience for Cloud Deployment
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# -------------------------------------------------------------
# Enterprise JWT Security Configuration (Dual-Token Architecture)
# -------------------------------------------------------------
# 256-bit secure HMAC signing secret
jwt.secret=${JWT_SECRET:vishwakarma_woods_work_enterprise_secure_jwt_secret_key_2026_super_safe_and_strong_contractor_portal_key_9022}

# 15-minute short-lived Access Token (15 * 60 * 1000 = 900,000 ms)
jwt.access-token-expiration-ms=900000

# 7-day Refresh Token stored in Supabase DB (7 * 24 * 60 * 60 * 1000 = 604,800,000 ms)
jwt.refresh-token-expiration-ms=604800000
