# Server configuration
server.port=8080

# Application name
spring.application.name=vishwakarma-contractor-backend

# -------------------------------------------------------------
# Live Supabase PostgreSQL Database Connection
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://db.jvnkvrecneirfcjhthgz.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate automatically creates and synchronizes all tables in Supabase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# Enterprise JWT Security Configuration (Dual-Token Architecture)
# -------------------------------------------------------------
# 256-bit secure HMAC signing secret
jwt.secret=vishwakarma_woods_work_enterprise_secure_jwt_secret_key_2026_super_safe_and_strong_contractor_portal_key_9022

# 15-minute short-lived Access Token (15 * 60 * 1000 = 900,000 ms)
jwt.access-token-expiration-ms=900000

# 7-day Refresh Token stored in Supabase DB (7 * 24 * 60 * 60 * 1000 = 604,800,000 ms)
jwt.refresh-token-expiration-ms=604800000
